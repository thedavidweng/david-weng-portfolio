name: Mirror to GitLab

on:
  push:
    branches:
      - "**"
      - "!dependabot/**"
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Plain git push — no Docker action. cssnr/mirror-repository-action
      # builds a container and needs docker.sock access, which the mbp2019
      # runner user does not have.
      - name: Mirror to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_TOKEN:-}" ]; then
            echo "GITLAB_TOKEN is not available in this context; skipping."
            exit 0
          fi
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/thedavidweng/david-weng-portfolio.git"
          ref="${GITHUB_REF#refs/heads/}"
          ref="${ref#refs/tags/}"
          git push gitlab "HEAD:refs/heads/${ref}" --force
