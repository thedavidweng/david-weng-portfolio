name: Mirror to GitLab

on:
  push:
    branches:
      - "**"
      - "!dependabot/**"
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5

    steps:
      - name: Verify private mirror destination
        env:
          MIRROR_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["MIRROR_TOKEN"]
          if not token:
              raise SystemExit("Mirror authentication is required")
          project = urllib.parse.quote(repository, safe="")
          request = urllib.request.Request(
              "https://gitlab.com/api/v4/projects/" + project,
              headers={"PRIVATE-TOKEN": token},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              destination = json.load(response)
          if destination["visibility"] != "private":
              raise SystemExit("Mirror destination must be private")
          print("Authenticated private mirror destination verified")
          PYTHON

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Plain git push — no Docker action. cssnr/mirror-repository-action
      # builds a container and needs docker.sock access, which the mbp2019
      # runner user does not have.
      - name: Mirror to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          gitlab_url="https://oauth2:${GITLAB_TOKEN}@gitlab.com/thedavidweng/david-weng-portfolio.git"
          if git remote get-url gitlab >/dev/null 2>&1; then
            git remote set-url gitlab "$gitlab_url"
          else
            git remote add gitlab "$gitlab_url"
          fi
          ref="${GITHUB_REF#refs/heads/}"
          ref="${ref#refs/tags/}"
          git push gitlab "HEAD:refs/heads/${ref}" --force
