name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]

permissions: {}

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 required — a shallow checkout has no merge base, so PR runs
      # would report pre-existing issues instead of only newly introduced ones.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: millionco/react-doctor@673ce802a375eeb4c3c5cb9a96d21eaeb7eafd93 # v2.3.1
