name: Cloudflare deployment status

on:
  check_run:
    types: [completed]

permissions:
  contents: read
  deployments: write
  statuses: write

jobs:
  report:
    if: >-
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      github.event.check_run.name == 'Cloudflare Pages'
    runs-on: ubuntu-latest
    steps:
      - name: Report Cloudflare Pages deployment to GitHub
        uses: actions/github-script@v7
        with:
          script: |
            const checkRun = context.payload.check_run;
            const sha = checkRun.head_sha;
            const summary = checkRun.output?.summary ?? "";
            const detailsUrl = checkRun.details_url;
            const conclusion = checkRun.conclusion;

            const urlMatch = summary.match(/href='([^']+)'/);
            const pagesUrl = urlMatch?.[1] ?? null;

            const branches = await github.rest.repos.listBranchesForHeadCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });

            const branchNames = branches.data.map((branch) => branch.name);
            const isProduction = branchNames.includes("main");
            const environment = isProduction ? "Production" : "Preview";
            const environmentUrl = isProduction
              ? "https://davidweng.eu.org"
              : pagesUrl;

            if (!environmentUrl) {
              core.setFailed("Could not determine Cloudflare Pages deployment URL.");
              return;
            }

            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              environment,
              description: "Cloudflare Pages",
              auto_merge: false,
              required_contexts: [],
              production_environment: isProduction,
              payload: {
                cloudflare_pages_url: pagesUrl,
                cloudflare_dashboard_url: detailsUrl,
              },
            });

            const state =
              conclusion === "success"
                ? "success"
                : conclusion === "failure"
                  ? "failure"
                  : "error";

            const description =
              conclusion === "success"
                ? "Deployed successfully to Cloudflare Pages"
                : "Cloudflare Pages deployment failed";

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state,
              environment,
              environment_url: state === "success" ? environmentUrl : undefined,
              log_url: detailsUrl,
              description,
            });