packages:
  - "."
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - vite
  - "@vitejs/*"
  - astro
  - "@astrojs/*"
  - oxlint
  - "@oxlint/*"
  - "@types/node"
  - webpack
  - workerd
  - wrangler
  - miniflare
  - "@cloudflare/*"
  - "@napi-rs/*"
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
trustPolicy: no-downgrade
trustPolicyExclude:
  - "chokidar@4.0.3"
  - "semver@6.3.1"
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.5
  vite-plus: 1.3.0
  "@vitest/coverage-v8": 5.0.5
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
