packages:
  - "."
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - vite
  - "@vitejs/*"
  - astro
  - "@astrojs/*"
  - oxlint
  - "@oxlint/*"
  - "@types/node"
  - webpack
  - workerd
  - wrangler
  - miniflare
  - "@cloudflare/*"
  - "@napi-rs/*"
trustPolicy: no-downgrade
trustPolicyExclude:
  - "chokidar@4.0.3"
  - "semver@6.3.1"
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true