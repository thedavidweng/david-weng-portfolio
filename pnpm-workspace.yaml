packages:
  - "."
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - vite
  - "@vitejs/*"
  - oxlint
  - "@oxlint/*"
  - "@types/node"
  - webpack
  - workerd
  - wrangler
  - miniflare
  - "@cloudflare/*"
trustPolicy: no-downgrade
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true